name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a preinstalled Android SDK (ANDROID_HOME already
      # set). android-actions/setup-android tries to install the legacy "tools"
      # package, which Google removed from the repository, so it fails outright.
      # We just accept the licenses on the preinstalled SDK and let the Android
      # Gradle Plugin auto-download whatever platform/build-tools it needs.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-vibe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
